name: Deploy Github page

on:
  push:
    branches:
      - main # Change to master if your default branch is master

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Static Site
        run: npm run build # Ensure this command triggers your SSG build (e.g., vite-ssg build)

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Check your framework's build folder.
          # vite-ssg usually outputs to 'dist'. Nuxt SSG outputs to '.output/public'.
          path: ./dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
